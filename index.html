<style>
html{color-scheme:light}
/* Conceito: caderno de provas e folha de gabarito. Fundo frio, cartões brancos como folhas, azul de caneta como acento. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --fg:#14172B; --muted:#5B6179; --line:#DCDFEA;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1120; --surface:#181B30; --fg:#ECEEF8; --muted:#9AA0BC; --line:#2A2E4A;
    --accent:#8B97FF; --accent-fg:#0F1120; --accent-soft:#252A55;
    --ok:#4FD1A0; --ok-soft:#14352B; --bad:#FF8A80; --bad-soft:#3A1D1B; --warn:#F2C260; --warn-soft:#3A2D10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1120; --surface:#181B30; --fg:#ECEEF8; --muted:#9AA0BC; --line:#2A2E4A;
  --accent:#8B97FF; --accent-fg:#0F1120; --accent-soft:#252A55;
  --ok:#4FD1A0; --ok-soft:#14352B; --bad:#FF8A80; --bad-soft:#3A1D1B; --warn:#F2C260; --warn-soft:#3A2D10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:780px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:24px} h2{font-size:21px} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.stack{display:flex;flex-direction:column;gap:14px}

.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}

.who img{width:26px;height:26px;border-radius:50%}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.card.click:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}

.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}

.ic{display:inline-flex;width:18px;height:18px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--fg);min-width:0}

input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}

.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.plain{background:var(--bg);color:var(--muted)}

.qitem{display:flex;gap:12px;align-items:flex-start}
.qn{font-family:var(--f-display);font-weight:700;font-size:18px;min-width:28px;color:var(--accent)}

.preview{width:100%;max-width:460px;border-radius:12px;border:1px solid var(--line);display:block}

.stat span{font-size:12px;color:var(--muted)}
.detail{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px}
.openin{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 0}

.krow select{width:auto;padding:6px 8px}

.credit{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
input[type=file]{display:none}

<script>
'use strict';

const SHEET = {
  W: 210, H: 297,
  markers: [[14, 14], [196, 14], [196, 283], [14, 283]], // TL, TR, BR (grande), BL
  markerSizes: [8, 8, 14, 8],
  maxQuestions: 75, maxCols: 3,
  colStarts: { 1: [79], 2: [48, 108], 3: [20, 78, 136] },
  rowY0: 76, rowPitch: 8, optOffset: 12, optPitch: 9, bubbleR: 2.6, headerY: 69,
  codeY: 47, bitSize: 4, bitPitch: 6, verX0: 44, stuX0: 98, verBits: 3, stuBits: 8,
};

function sheetLayout(n) {
  const cols = Math.min(SHEET.maxCols, Math.max(1, Math.ceil(n / 25)));
  const rows = Math.max(1, Math.ceil(n / cols));
  return { cols, rows };
}
function colX0(c, lay) { return SHEET.colStarts[lay.cols][c]; }
function bubblePos(q, o, lay) {
  const c = Math.floor(q / lay.rows), r = q % lay.rows;
  return [colX0(c, lay) + SHEET.optOffset + o * SHEET.optPitch, SHEET.rowY0 + r * SHEET.rowPitch];
}
function codeBitPos(kind, i) {
  return kind === 'v' ? [SHEET.verX0 + i * SHEET.bitPitch, SHEET.codeY] : [SHEET.stuX0 + i * SHEET.bitPitch, SHEET.codeY];
}
function toBits(value, count) {
  const a = [];
  for (let i = count - 1; i >= 0; i--) a.push((value >> i) & 1);
  return a;
}
function fromBits(arr) { return arr.reduce((a, b) => a * 2 + b, 0); }

/* ---------- Versões embaralhadas (determinísticas pela semente da prova) ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
/* Versão 0 (A) = ordem original. Demais: objetivas e alternativas embaralhadas. */
/* Prova só com gabarito: sem texto de questões, cada versão tem o seu gabarito em exam.keys[v]. */
function keyComplete(exam) {
  if (exam.mode !== 'key') return true;
  const items = exam.items || [];
  for (let v = 0; v < (exam.versions || 1); v++) {
    const k = (exam.keys && exam.keys[v]) || [];
    for (let i = 0; i < items.length; i++) if (!Number.isInteger(k[i]) || k[i] < 0 || k[i] >= ((items[i].options || []).length || exam.nOpt)) return false;
  }
  return true;
}
function buildVersion(exam, v) {
  const items = exam.items || [];
  if (exam.mode === 'key') {
    const keys = (exam.keys && exam.keys[v]) || [];
    const obj = items.filter(i => i.type === 'obj').map((item, i) => ({ item, perm: item.options.map((_, k) => k), correctPos: Number.isInteger(keys[i]) ? keys[i] : null }));
    return { obj, open: [] };
  }
  const rnd = mulberry32(((exam.seed | 0) ^ Math.imul(v + 1, 2654435761)) >>> 0);
  let obj = items.filter(i => i.type === 'obj');
  const open = items.filter(i => i.type === 'open');
  if (v > 0) obj = shuffled(obj, rnd);
  const out = obj.map(item => {
    const idx = item.options.map((_, k) => k);
    const perm = (v > 0 && !item.fixOpts) ? shuffled(idx, rnd) : idx;
    return { item, perm, correctPos: perm.indexOf(item.correct) };

}
function gradeObj(exam, v, answers) {
  const ver = buildVersion(exam, v);
  let pts = 0, max = 0, right = 0;
  ver.obj.forEach((q, i) => {
    const p = Number(q.item.points) || 0;
    max += p;
    if (answers && answers[i] === q.correctPos) { pts += p; right++; }
  });
  return { pts, max, right, n: ver.obj.length };
}

/* ---------- Geometria ---------- */
function gauss(A, b) {
  const n = b.length;
  const M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    if (Math.abs(M[p][c]) < 1e-12) return null;
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const f = M[r][c] / M[c][c];
      for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
    }
  }
  return M.map((r, i) => r[n] / r[i]);
}
function solveHomography(src, dst) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -x * u, -y * u]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -x * v, -y * v]); b.push(v);

  return gauss(A, b);

function applyH(h, x, y) {
  const d = h[6] * x + h[7] * y + 1;
  return [(h[0] * x + h[1] * y + h[2]) / d, (h[3] * x + h[4] * y + h[5]) / d];

function diskMean(gray, W, H, cx, cy, r) {
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(W - 1, Math.ceil(cx + r));
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(H - 1, Math.ceil(cy + r));
  const r2 = r * r;
  let s = 0, c = 0;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {

      if (dx * dx + dy * dy <= r2) { s += gray[y * W + x]; c++; }

  return c ? s / c : 255;

/* ---------- Detecção dos 4 cantos ---------- */
function darkMask(gray, W, H) {
  const win = Math.max(25, Math.round(W / 7) | 1);
  const half = win >> 1;
  const W1 = W + 1;
  const I = new Float64Array(W1 * (H + 1));
  for (let y = 0; y < H; y++) {
    let row = 0;
    for (let x = 0; x < W; x++) {
      row += gray[y * W + x];
      I[(y + 1) * W1 + (x + 1)] = I[y * W1 + (x + 1)] + row;
    }

  const mask = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) {
    const ya = Math.max(0, y - half), yb = Math.min(H - 1, y + half);
    for (let x = 0; x < W; x++) {
      const xa = Math.max(0, x - half), xb = Math.min(W - 1, x + half);
      const sum = I[(yb + 1) * W1 + (xb + 1)] - I[ya * W1 + (xb + 1)] - I[(yb + 1) * W1 + xa] + I[ya * W1 + xa];
      const mean = sum / ((xb - xa + 1) * (yb - ya + 1));
      const g = gray[y * W + x];
      if (g < mean * 0.72 && g < 170) mask[y * W + x] = 1;
    }

  return mask;
}
function findBlobs(mask, W, H, minArea) {
  const blobs = [];
  const stack = new Int32Array(W * H);
  for (let s = 0; s < W * H; s++) {
    if (mask[s] !== 1) continue;
    let sp = 0;
    stack[sp++] = s; mask[s] = 2;
    let minx = W, maxx = 0, miny = H, maxy = 0, area = 0, sx = 0, sy = 0;
    while (sp) {
      const p = stack[--sp];
      const x = p % W, y = (p - x) / W;
      area++; sx += x; sy += y;
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y;
      if (x > 0 && mask[p - 1] === 1) { mask[p - 1] = 2; stack[sp++] = p - 1; }
      if (x < W - 1 && mask[p + 1] === 1) { mask[p + 1] = 2; stack[sp++] = p + 1; }
      if (y > 0 && mask[p - W] === 1) { mask[p - W] = 2; stack[sp++] = p - W; }
      if (y < H - 1 && mask[p + W] === 1) { mask[p + W] = 2; stack[sp++] = p + W; }
    }

function orderCorners(pts) {
  let tl = 0, br = 0, tr = 0, bl = 0;
  pts.forEach((p, i) => {
    if (p.cx + p.cy < pts[tl].cx + pts[tl].cy) tl = i;
    if (p.cx + p.cy > pts[br].cx + pts[br].cy) br = i;
    if (p.cx - p.cy > pts[tr].cx - pts[tr].cy) tr = i;

function parseKey(text, counts) {

  if (pairs.length >= Math.max(1, Math.ceil(n / 2))) {
    const out = Array(n).fill(null);
    for (const m of pairs) { const q = +m[1] - 1, k = L.indexOf(m[2].toLowerCase()); if (q >= 0 && q < n) { const e = bad(q, k); if (e) return e; out[q] = k; } }
    return out;
  }
  if (/^[\sA-Ea-e,;.\-–\/|]+$/.test(text)) {
    const seq = (text.match(/[A-Ea-e]/g) || []).map(c => L.indexOf(c.toLowerCase()));
    if (seq.length !== n) return { error: `Você colou ${seq.length} resposta${seq.length === 1 ? '' : 's'}, e a prova tem ${n} questões.` };
    for (let q = 0; q < n; q++) { const e = bad(q, seq[q]); if (e) return e; }
    return seq;
  }
  return { error: 'Não entendi o texto. Use letras seguidas (ABCDA…) ou pares como 1-A 2-C 3-B.' };
}

async function loadGray(file) {
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (_) { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  const sc = Math.min(1, 1600 / Math.max(w0, h0));
  const W = Math.round(w0 * sc), H = Math.round(h0 * sc);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  cx.drawImage(bmp, 0, 0, W, H);
  const d = cx.getImageData(0, 0, W, H).data, gray = new Uint8Array(W * H);
  for (let i = 0, p = 0; i < gray.length; i++, p += 4) gray[i] = (d[p] * 299 + d[p + 1] * 587 + d[p + 2] * 114) / 1000;
  return { gray, W, H, canvas: cv };
}

          open.length ? h('td', { class: 'r num' }, r ? (t.openDone ? fmt(t.op) : h('span', { class: 'pill warn' }, 'lançar')) : '') : null,
          h('td', { class: 'r num' }, r ? h('b', null, fmt(t.nota)) : ''));
        const out = [tr];
        if (r && isOpen) out.push(h('tr', null, h('td', { colspan: 4, style: 'padding-top:0;border-top:0' }, detail(e, s, r, t, names))));
        return out;
      })))));
    root.replaceChildren(...parts);
  }
  function stat(v, l) { return h('div', { class: 'stat' }, h('b', { class: 'num' }, v), h('span', null, l)); }
  function detail(e, s, r, t, names) {
    const ver = buildVersion(e, r.version); const open = (e.items || []).filter(i => i.type === 'open');
    const marks = ver.obj.map((q, i) => { const a = (r.answers || [])[i]; const ok = a === q.correctPos;
      return h('span', { class: 'pill ' + (ok ? 'ok' : a === -1 ? 'plain' : 'bad'), title: 'Questão ' + (i + 1) }, `${i + 1} ${ok ? '✓' : a >= 0 ? LETTERS[a] : '–'}`); });
    return h('div', { class: 'detail stack', style: 'gap:10px' },
      h('div', { class: 'row', style: 'gap:6px' }, marks),
      open.map((it, i) => {
        const inp = h('input', { type: 'text', inputmode: 'decimal', id: `op-${s.id}-${it.id}`, value: r.open && r.open[it.id] != null ? String(r.open[it.id]).replace('.', ',') : '', placeholder: '0', 'aria-label': 'Pontos da questão aberta ' + (i + 1),
          on: { change: async () => {
            const raw = inp.value.trim(); let v = null;
            if (raw !== '') { v = num(raw); if (!(v >= 0) || v > it.points) { toast(`Digite de 0 a ${fmt(it.points)}.`); inp.value = ''; return; } }
            dbop(() => S.db.doc('exams/' + id + '/results/' + s.id).update({ open: { [it.id]: v }, ts: Date.now() }));
          } } });
        return h('div', { class: 'openin' }, h('label', { for: inp.id, class: 'grow qtxt small' }, `Aberta ${i + 1}: ${it.text.slice(0, 80)}${it.text.length > 80 ? '…' : ''}`), h('div', { class: 'row', style: 'flex-wrap:nowrap' }, inp, h('span', { class: 'small muted num' }, '/ ' + fmt(it.points))));
      }),
      h('div', { class: 'small muted' }, `Corrigida ${r.via === 'foto' ? 'por foto' : 'à mão'}${names[r.by] || r.byName ? ' por ' + (names[r.by] || r.byName) : ''}.`),
      h('div', { class: 'row' }, btn('Corrigir de novo', { cls: 'sm', on: () => { S.examTab = 'corrigir'; go({ name: 'exam', id }); } }),
        confirmBtn('Excluir correção', () => dbop(() => S.db.doc('exams/' + id + '/results/' + s.id).delete()), { cls: 'sm' })));
  }
  return { el: root, update };
}

/* ============ arquivos: enviar prova e receber correções ============ */
const SAFE_ID = /^[A-Za-z0-9_\-.~:@+]{1,200}$/;
async function importText(text) {
  let p;
  try { p = JSON.parse(text); } catch (_) { throw new Error('Esse arquivo não é do Gabaritou.'); }
  if (!p || p.gabaritou !== 1 || !p.exam || !SAFE_ID.test(String(p.exam.id)) || !p.exam.data || !Array.isArray(p.exam.data.items)) throw new Error('Esse arquivo não é do Gabaritou.');
  if (p.exam.data.mode !== 'key') throw new Error('Esta prova tem questões. Só o Gabaritou completo abre esse arquivo.');
  if (p.exam.data.items.length > COMPACT.maxQ) throw new Error('Esta prova tem mais de ' + COMPACT.maxQ + ' questões e não cabe na folha compacta.');
  const id = String(p.exam.id);
  const students = (p.students || []).filter(x => x && SAFE_ID.test(String(x.id)) && x.data && x.data.name);
  const results = (p.results || []).filter(x => x && SAFE_ID.test(String(x.id)) && x.data && Array.isArray(x.data.answers));
  const existing = S.exams.get(id);
  let examUpdated = false;
  if (!existing) await S.db.doc('exams/' + id).set(p.exam.data);
  else if ((p.exam.data.editedAt || 0) > (existing.editedAt || 0)) { await S.db.doc('exams/' + id).set(Object.assign({}, existing, p.exam.data)); examUpdated = true; }
  const curSt = new Map((await S.db.collection('exams/' + id + '/students').get()).docs.map(d => [d.id, d.data()]));
  let maxNum = Math.max(0, ...[...curSt.values()].map(x => x.num || 0));
  let newStudents = 0, added = 0, updated = 0;
  for (const st of students) {
    if (curSt.has(st.id)) continue;
    const d = Object.assign({}, st.data);
    if ([...curSt.values()].some(x => x.num === d.num)) d.num = ++maxNum; else maxNum = Math.max(maxNum, d.num || 0);
    await S.db.doc('exams/' + id + '/students/' + st.id).set(d); curSt.set(st.id, d); newStudents++;
  }
  const curRes = new Map((await S.db.collection('exams/' + id + '/results').get()).docs.map(d => [d.id, d.data()]));
  for (const r of results) {
    const cur = curRes.get(r.id);
    if (cur && (r.data.ts || 0) <= (cur.ts || 0)) continue;
    await S.db.doc('exams/' + id + '/results/' + r.id).set(r.data); cur ? updated++ : added++;
  }
  return { id, title: existing ? existing.title : p.exam.data.title, created: !existing, examUpdated, added, updated, newStudents };
}
function importSummary(r) {
  const bits = [];
  if (r.examUpdated) bits.push('gabarito atualizado');
  if (r.created) bits.push('prova “' + r.title + '” importada');
  if (r.added) bits.push(r.added + ' correção(ões) nova(s)');
  if (r.updated) bits.push(r.updated + ' atualizada(s)');
  if (r.newStudents) bits.push(r.newStudents + ' aluno(s) novo(s)');
  return bits.length ? 'Importado: ' + bits.join(', ') + '.' : 'Nada novo neste arquivo.';
}
function pickImport(examId) {
  const inp = h('input', { type: 'file', accept: '.json,application/json' });
  document.body.append(inp);
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; inp.remove();
    if (!f) return;
    try {
      const r = await importText(await f.text());
      toast(importSummary(r));
      if (!examId || r.created) { S.examTab = r.created ? 'questoes' : 'notas'; go({ name: 'exam', id: r.id }); }
    } catch (e) { toast(e && e.message || 'Não consegui importar esse arquivo.'); }
  });
  inp.click();
}
function exportExam(id) {
  const e = S.exams.get(id);
  const payload = { gabaritou: 1, ts: Date.now(), from: S.me && S.me.name || '', exam: { id, data: e },
    students: [...S.students].map(([sid, d]) => ({ id: sid, data: d })), results: [...S.results].map(([rid, d]) => ({ id: rid, data: d })) };
  const day = new Date().toISOString().slice(0, 10);
  return saveFile(`gabarito-${slug(e.title)}-${day}.json`, JSON.stringify(payload));
}
function tabArquivos(id) {
  const root = h('div', { class: 'stack' });
  function update() {
    const e = examOf(id);
    const nRes = S.results.size, nSt = S.students.size;
    root.replaceChildren(
      h('div', { class: 'card stack' }, h('h3', null, 'Enviar a prova a um colaborador'),
        h('p', { class: 'small muted' }, 'O arquivo leva as questões, os alunos e as correções que já existem. Mande junto o app Gabaritou, para a pessoa abrir no navegador do celular ou do computador.'),
        S.dl ? h('div', { class: 'row' }, btn('Baixar arquivo da prova', { icon: 'dl', cls: 'primary', on: () => exportExam(id) })) : notice('Salvar arquivos não está disponível nesta tela.', 'bad')),
      h('div', { class: 'card stack' }, h('h3', null, 'Receber correções'),
        h('p', { class: 'small muted' }, 'Importe o arquivo que o colaborador devolveu. Só entram as folhas novas ou mais recentes, e nada do que já está aqui é apagado.'),
        h('div', { class: 'row' }, btn('Importar arquivo', { icon: 'dl', on: () => pickImport(id) }))),
      h('div', { class: 'card stack' }, h('h3', null, 'Passo a passo'),
        h('ol', { class: 'small muted', style: 'margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px' },
          h('li', null, 'Você baixa o arquivo da prova e o envia ao colaborador, junto com o app.'),
          h('li', null, 'Ele abre o app, toca em Importar arquivo e escolhe o arquivo da prova.'),
          h('li', null, 'Corrige as folhas na aba Corrigir. Tudo fica guardado no aparelho dele.'),
          h('li', null, 'Ao terminar, ele baixa o arquivo na aba Arquivos e devolve a você.'),
          h('li', null, 'Você importa o arquivo aqui, e as notas aparecem na aba Notas.'))),
      h('div', { class: 'card stack' }, h('h3', null, 'Excluir prova'),
        h('p', { class: 'small muted' }, `Apaga a prova, ${nSt} aluno${nSt === 1 ? '' : 's'} e ${nRes} correç${nRes === 1 ? 'ão' : 'ões'} deste aparelho. Baixe o arquivo antes se quiser guardar uma cópia.`),
        h('div', { class: 'row' }, confirmBtn('Excluir prova', async () => {
          const ok = await dbop(async () => {
            for (const k of S.results.keys()) await S.db.doc('exams/' + id + '/results/' + k).delete();
            for (const k of S.students.keys()) await S.db.doc('exams/' + id + '/students/' + k).delete();
            await S.db.doc('exams/' + id).delete();
          });
          if (ok) go({ name: 'exams' });
        }, { icon: 'trash' }))));
  }
  return { el: root, update };
}

/* ============ início ============ */
async function boot() {
  const who = document.getElementById('who');
  const c = window.claude;
  if (c && c.use) {
    [S.db, S.user, S.dl] = await Promise.all([c.use('db'), c.use('user'), c.use('downloads')]);
    if (S.user) {
      try { S.me = await S.user.me(); } catch (_) {}
      try { S.canWrite = await S.user.can('data.write'); } catch (_) {}
      if (S.me) who.replaceChildren(h('img', { src: S.me.avatarUrl, alt: '' }), h('span', null, S.me.name || 'Você'));
    }
  } else {
    S.local = true; S.db = makeLocalDb(); S.dl = localDl; S.canWrite = true;
    let nm = ''; try { nm = localStorage.getItem('gabrapido:name') || ''; } catch (_) {}
    S.me = { id: 'local', name: nm };
    who.replaceChildren(h('span', { class: 'pill warn' }, 'Offline'),
      h('input', { type: 'text', id: 'who-name', value: nm, placeholder: 'Seu nome', 'aria-label': 'Seu nome', style: 'width:120px;padding:5px 8px', on: { input: ev => { S.me.name = ev.target.value.trim(); try { localStorage.setItem('gabrapido:name', S.me.name); } catch (_) {} } } }));
  }
  render();
  if (!S.db) return;
  const mainEl = document.getElementById('main');
  if (S.canWrite === false) mainEl.before(notice('Você pode ver as provas, mas não alterar. Peça ao dono da página acesso de colaborador para ajudar na correção.'));
  if (S.local) mainEl.before(notice(S.db.persistent() ? 'Modo offline: as provas ficam guardadas só neste navegador. Para não perder nada, baixe o arquivo na aba Arquivos.' : 'Este navegador não guarda dados entre visitas. Baixe o arquivo na aba Arquivos antes de fechar a página.', 'info'));
  let gotExams = false;
  const loadTimer = setTimeout(() => { if (!S.ready) { S.ready = true; notify(); toast('Os dados ainda não responderam. Verifique a conexão.'); } }, 10000);
  const done = () => { if (gotExams) { S.ready = true; clearTimeout(loadTimer); } };
  S.db.collection('exams').onSnapshot(s => { S.exams = new Map(s.docs.map(d => [d.id, d.data()])); gotExams = true; done(); notify(); }, e => { S.loadErr = e; gotExams = true; done(); notify(); });
}
boot();
